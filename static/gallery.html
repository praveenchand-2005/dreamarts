<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Gallery</title><link rel="stylesheet" href="/styles.css"><style>.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}.piece{border:1px solid #e5e5e5;border-radius:14px;overflow:hidden;background:#fff}.piece img{width:100%;aspect-ratio:1;object-fit:cover}.piece div{padding:16px}.stars{letter-spacing:2px;font-size:18px}.empty{text-align:center;padding:70px 10px;color:#777}</style></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><a href="/" class="brand">DREAMARTS</a><div><a href="/studio" class="btn">Create yours</a></div></div></nav><main class="wrap section"><div class="eyebrow">Real creations · Real customers</div><h1>Dreamarts Gallery</h1><p>Finished artworks shared with permission by our customers.</p><div id="gallery" class="gallery"></div></main><script>fetch('/api/gallery').then(r=>r.json()).then(items=>{const g=document.getElementById('gallery');if(!items.length){g.innerHTML='<div class="empty">Our customer gallery is growing. Your creation could be next.</div>';return}g.innerHTML=items.map(x=>'<article class="piece"><img loading="lazy" src="'+x.photo_url+'" alt="Dreamarts customer artwork"><div><div class="stars">'+'★'.repeat(x.rating)+'☆'.repeat(5-x.rating)+'</div>'+(x.review?'<p>“'+x.review.replace(/[<>&]/g,'')+'”</p>':'')+'<small>Verified Dreamarts customer</small></div></article>').join('')}).catch(()=>document.getElementById('gallery').innerHTML='<div class="empty">Gallery temporarily unavailable.</div>')</script></body></html>
