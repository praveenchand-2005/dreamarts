<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your Dreamarts order</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS</div><a class="btn" href="/">Back to website</a></div></nav><main class="wrap section"><div class="eyebrow">Order tracking</div><h2>Your artwork journey.</h2><div class="card" style="max-width:720px"><form id="f"><input id="id" placeholder="Enter your order number, e.g. DA-20260902-ABC123" required><button class="btn">Track my order</button></form><div id="out" style="margin-top:25px"></div></div></main><script>const q=new URLSearchParams(location.search),id=document.getElementById('id'),out=document.getElementById('out');id.value=q.get('order')||'';async function go(e){if(e)e.preventDefault();if(!id.value)return;out.textContent='Checking your artwork...';let r=await fetch('/api/track/'+encodeURIComponent(id.value.trim()));let d=await r.json();if(!r.ok){out.textContent=d.error||'Order not found';return}out.innerHTML='<h3>'+d.orderNumber+'</h3><p><b>Current stage:</b> '+d.status+'</p><p>'+d.artwork.size+' · '+d.artwork.shape+'</p><hr><div>'+d.history.map(x=>'<p><b>'+x.status+'</b><br><small>'+x.at.replace('T',' ').replace('Z',' UTC')+'</small></p>').join('')+'</div>'+(d.shipping&&d.shipping.trackingNumber?'<p><b>Tracking:</b> '+d.shipping.trackingNumber+'</p>':'')}</script></body></html>
