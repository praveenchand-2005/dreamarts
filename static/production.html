<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Production</title><link rel="stylesheet" href="/styles.css"><style>
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}.lane{background:#f6f6f6;border-radius:14px;padding:12px;min-height:70vh}.lane h3{margin:4px 0 14px}.job{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin-bottom:10px}.job p{font-size:12px;color:#666}.job input,.job textarea,.job select{width:100%;box-sizing:border-box;margin:6px 0;padding:8px;border:1px solid #ddd;border-radius:7px}.job button{width:100%;margin-top:5px}@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}@media(max-width:560px){.board{grid-template-columns:1fr}.lane{min-height:auto}}
</style></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>PRODUCTION OPERATIONS</small></div><a class="btn light" href="/admin">Admin</a></div></nav><main class="wrap section"><div class="eyebrow">Factory workflow</div><h2>Production & Shipping Board</h2><div class="board" id="board"></div></main>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const cfg=await fetch('/api/public-config').then(r=>r.json()),sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),{data:{session}}=await sb.auth.getSession();if(!session)location='/login';const H={Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};
const lanes=[['PAID','Ready for Production'],['IN_PRODUCTION','In Production'],['QUALITY_CHECK','Quality Check'],['SHIPPED','Shipping']];
function card(o){return '<article class="job"><b>'+o.order_number+'</b><p>'+o.artwork_shape+' · '+(o.artwork_width_mm||'?')+' × '+(o.artwork_height_mm||'?')+' mm</p><input class="courier" placeholder="Courier" value="'+(o.courier||'')+'"><input class="tracking" placeholder="Tracking number" value="'+(o.tracking_number||'')+'"><textarea class="notes" placeholder="Production note">'+(o.admin_notes||'')+'</textarea><select class="next"><option value="">Move to…</option>'+lanes.map(l=>'<option value="'+l[0]+'">'+l[1]+'</option>').join('')+'<option value="DELIVERED">Delivered</option></select><button class="btn save" data-id="'+o.order_number+'">Update job</button></article>'}
async function load(){const r=await fetch('/api/admin/production',{headers:H}),os=await r.json();document.getElementById('board').innerHTML=lanes.map(([s,n])=>'<section class="lane"><h3>'+n+' <small>(' +os.filter(o=>o.status===s).length+')</small></h3>'+os.filter(o=>o.status===s).map(card).join('')+'</section>').join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const c=b.closest('.job'),next=c.querySelector('.next').value,p={courier:c.querySelector('.courier').value,tracking_number:c.querySelector('.tracking').value,admin_notes:c.querySelector('.notes').value};if(next)p.status=next;const x=await fetch('/api/admin/production/'+b.dataset.id,{method:'PATCH',headers:H,body:JSON.stringify(p)});if(!x.ok)alert('Update failed');else load()})}load();</script></body></html>
