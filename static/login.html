<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Account</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS</div><a href="/" class="btn">Back</a></div></nav><main class="auth-page"><div class="auth-card"><div class="eyebrow">Your Dreamarts account</div><h2 id="title">Welcome back.</h2><p>Track your artwork, approvals and production journey.</p><div class="auth-tabs"><button class="active" data-mode="login">Login</button><button data-mode="signup">Create account</button></div><form id="auth"><div id="nameWrap" hidden><label>Full name</label><input id="name" autocomplete="name"></div><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="current-password"><button class="btn auth-submit" id="submit">Login</button><p id="msg"></p></form><p class="auth-note">Secure authentication powered by Dreamarts account services.</p></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/public-config').then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabasePublishableKey){document.getElementById('msg').textContent='Authentication is still being configured.';throw new Error('Missing Supabase configuration')}const supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let mode='login';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));nameWrap.hidden=mode==='login';submit.textContent=mode==='login'?'Login':'Create account';title.textContent=mode==='login'?'Welcome back.':'Create your account.'});const existing=await supabase.auth.getSession();if(existing.data.session)location.href='/dashboard';auth.onsubmit=async e=>{e.preventDefault();msg.textContent='Please wait...';const email=email.value.trim(),password=password.value;if(mode==='signup'){const{name:fullName}=window;const r=await supabase.auth.signUp({email,password,options:{data:{full_name:fullName.value.trim()}}});if(r.error){msg.textContent=r.error.message;return}msg.textContent='Account created. Check your email to confirm, then login.'}else{const r=await supabase.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;return}location.href='/dashboard'}};</script></body></html>
