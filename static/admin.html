<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Studio</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small style="font-size:10px;letter-spacing:2px">STUDIO</small></div><a class="btn" href="/">View website</a></div></nav><main class="wrap section"><div class="eyebrow">Production control</div><h2>Artwork pipeline.</h2><div id="stats" class="statrow" style="background:#171411;padding:18px;border-radius:16px;margin:25px 0"></div><div class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">Orders</h3><select id="filter" onchange="render()"><option value="">All stages</option></select></div><div id="orders" style="margin-top:18px"></div></div></main><script>let data=[],flow=[];async function load(){let r=await fetch('/api/dashboard');let d=await r.json();data=d.recent||[];flow=d.flow||[];document.getElementById('filter').innerHTML='<option value="">All stages</option>'+flow.map(x=>'<option>'+x+'</option>').join('');document.getElementById('stats').innerHTML='<div><b>'+d.total+'</b><span>Total orders</span></div>'+Object.entries(d.counts||{}).map(([k,v])=>'<div><b>'+v+'</b><span>'+k+'</span></div>').join('');render()}function render(){let filter=document.getElementById('filter').value;let rows=data.filter(o=>!filter||o.status===filter);document.getElementById('orders').innerHTML=rows.length?rows.map(o=>'<div class="card" style="margin:12px 0"><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:15px"><div><b>'+o.orderNumber+'</b><p style="margin:4px 0">'+o.customer.name+' · '+o.customer.phone+'</p><small>'+o.artwork.shape+' · '+o.artwork.size+'</small></div><div><label>Stage</label><select id="s-'+o.orderNumber+'">'+flow.map(x=>'<option '+(x===o.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><button class="btn" onclick="save(\''+o.orderNumber+'\')">Update stage</button><a style="display:block;margin-top:8px;font-size:12px" href="/api/orders/'+o.orderNumber+'" target="_blank">View full order</a></div></div></div>').join(''):'<p>No orders in this stage.</p>'}async function save(id){let status=document.getElementById('s-'+id).value;let r=await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok){alert('Update failed');return}await load()}load()</script><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const cfg=await fetch('/api/public-config').then(r=>r.json()),sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),{data:{session}}=await sb.auth.getSession();if(!session)location='/login';
const H={Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};
async function refresh(){const r=await fetch('/api/admin/orders',{headers:H});const os=await r.json();document.querySelector('main').insertAdjacentHTML('beforeend','<section class="card"><h3>Production Orders</h3>'+os.map(o=>'<div class="order-row"><div><b>'+o.order_number+'</b><p>'+o.artwork_shape+' · '+o.status.replaceAll('_',' ')+'</p><input class="price" placeholder="Price" value="'+(o.price||'')+'"><select class="status"><option>AWAITING_APPROVAL</option><option>QUOTE_SENT</option><option>PAYMENT_PENDING</option><option>PAID</option><option>IN_PRODUCTION</option><option>QUALITY_CHECK</option><option>SHIPPED</option><option>DELIVERED</option></select><button class="btn save" data-id="'+o.order_number+'">Save</button></div></div>').join('')+'</section>');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const row=b.parentElement;await fetch('/api/admin/orders/'+b.dataset.id,{method:'PATCH',headers:H,body:JSON.stringify({price:row.querySelector('.price').value,status:row.querySelector('.status').value})});location.reload()})}refresh();
</script></body></html>
