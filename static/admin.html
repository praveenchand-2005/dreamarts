<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="adminbar"><div class="wrap"><b>DREAMARTS / OWNER DASHBOARD</b></div></div><main class="wrap section"><h2>Order control centre</h2><div class="metrics" id="metrics"></div><div class="card" style="margin-top:24px"><h3>Recent custom requests</h3><div id="orders">Loading orders...</div></div></main><script>
async function load(){let r=await fetch('/api/dashboard'),d=await r.json(),m=document.getElementById('metrics');m.innerHTML='<div class="metric">Total requests<br><b>'+d.total+'</b></div>'+['NEW REQUEST','REVIEWING','IN PRODUCTION','COMPLETED'].map(s=>'<div class="metric">'+s+'<br><b>'+(d.counts[s]||0)+'</b></div>').join('');document.getElementById('orders').innerHTML=d.recent.length?d.recent.map(o=>'<div style="padding:16px;border-bottom:1px solid #eee"><b>'+o.orderNumber+'</b> — '+(o.customer.name||'Guest')+'<br><small>'+o.customer.phone+' · '+o.artwork.size+' · '+o.artwork.shape+'</small><br><img src="'+o.artwork.photo+'" style="width:90px;height:90px;object-fit:cover;border-radius:8px;margin-top:8px"><br><select onchange="updateStatus(\''+o.orderNumber+'\',this.value)"><option>'+o.status+'</option><option>REVIEWING</option><option>IN PRODUCTION</option><option>COMPLETED</option><option>CANCELLED</option></select></div>').join(''):'No orders yet.'}
async function updateStatus(id,status){await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}load();</script></body></html>
