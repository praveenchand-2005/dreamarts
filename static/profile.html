<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Profile</title><link rel="stylesheet" href="/styles.css"><style>.form{max-width:720px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS</div><a href="/dashboard" class="btn light">My Account</a></div></nav><main class="wrap section form"><div class="eyebrow">Customer details</div><h2>Profile & Shipping Address</h2><p>Keep these details accurate for artwork delivery and WhatsApp updates.</p><form id="form"><div class="grid"><input name="full_name" placeholder="Full name"><input name="phone" placeholder="WhatsApp / phone number"></div><input name="address_line1" placeholder="Address line 1"><input name="address_line2" placeholder="Address line 2 (optional)"><div class="grid"><input name="city" placeholder="City"><input name="state" placeholder="State"></div><div class="grid"><input name="postal_code" placeholder="PIN / Postal code"><input name="country" placeholder="Country" value="India"></div><button class="btn">Save profile</button><p id="msg"></p></form></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/public-config').then(r=>r.json()),sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),{data:{session}}=await sb.auth.getSession();if(!session)location='/login';const H={Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};const p=await fetch('/api/profile',{headers:H}).then(r=>r.json());const profile=Array.isArray(p)?p[0]:p;Object.entries(profile||{}).forEach(([k,v])=>{if(document.querySelector('[name='+k+']'))document.querySelector('[name='+k+']').value=v||''});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/profile',{method:'PATCH',headers:H,body:JSON.stringify(data)});document.getElementById('msg').textContent=r.ok?'Profile saved successfully.':'Could not save profile.'}</script></body></html>
