<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Studio</title><link rel="stylesheet" href="/styles.css"></head><body class="studio-page"><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>STUDIO</small></div><a class="btn light" href="/">Exit studio</a></div></nav><header class="studio-head"><div class="wrap"><div class="eyebrow">Dreamarts generation engine</div><h2 style="margin-bottom:6px">Shape your memory into thread.</h2><p class="lead" style="margin-left:0">Adjust the design, generate your preview, and choose the version you want us to create.</p></div></header><main class="wrap studio-grid"><section><div class="preview-stage"><div class="engine-badge" id="engine">GENERATING PREVIEW</div><canvas id="art" width="900" height="900"></canvas></div><div class="preview-meta"><span id="metaShape"></span><span id="metaSize"></span><span id="metaNails"></span><span id="metaLines"></span></div></section><aside class="studio-panel"><h3>Design controls</h3><div class="control"><label>Shape <span id="shapeVal"></span></label><div class="seg" id="shapes"><button>Circle</button><button>Square</button><button>Rectangle</button><button>Heart</button></div></div><div class="control"><label>Nail density <span id="nailVal"></span></label><input id="nails" type="range" min="200" max="1200" step="100"></div><div class="control"><label>Thread lines <span id="lineVal"></span></label><input id="lines" type="range" min="1000" max="8000" step="500"></div><div class="control"><label>Contrast <span id="contrastVal"></span></label><input id="contrast" type="range" min="30" max="150" value="90"></div><div class="control"><label>Thread tone</label><div class="seg" id="tones"><button data-v="black">Black</button><button data-v="sepia">Sepia</button><button data-v="blue">Blue</button><button data-v="red">Red</button></div></div><div class="studio-actions"><button class="btn" id="regen">Regenerate preview</button><button class="btn light" id="compare">Original photo</button><button class="btn" id="confirm">Continue with this design →</button></div><p id="studioNotice" class="notice"></p></aside></main><script>
const imgData=sessionStorage.getItem('dreamarts_studio_image'),cfg=JSON.parse(sessionStorage.getItem('dreamarts_studio_config')||'null');
if(!imgData||!cfg)location.href='/#custom';
const c=document.getElementById('art'),x=c.getContext('2d'),originalImg=new Image();
let shape=cfg.shape==='Recommend'?'Circle':cfg.shape||'Circle',tone='black',previewData=null,busy=false,stats=null;
const nails=document.getElementById('nails'),lines=document.getElementById('lines'),contrast=document.getElementById('contrast');
nails.value=cfg.anchor_nails||600; lines.value=cfg.string_lines||4000;
function meta(){
 document.getElementById('shapeVal').textContent=shape;document.getElementById('nailVal').textContent=nails.value+' nails';
 document.getElementById('lineVal').textContent=Number(lines.value).toLocaleString()+' lines';
 document.getElementById('contrastVal').textContent=contrast.value+'%';
 document.getElementById('metaShape').textContent=shape;document.getElementById('metaSize').textContent=cfg.width_mm+' × '+cfg.height_mm+' mm';
 document.getElementById('metaNails').textContent=nails.value+' nails';
 document.getElementById('metaLines').textContent=Number(lines.value).toLocaleString()+' lines';
}
function paint(data){let im=new Image();im.onload=()=>{x.clearRect(0,0,900,900);x.drawImage(im,0,0,900,900)};im.src=data}
async function generate(){
 if(busy)return; busy=true; document.getElementById('engine').textContent='DREAMARTS ENGINE V2 · ANALYSING';
 document.getElementById('studioNotice').textContent='Optimizing thread paths and controlling density…';
 try{
  const r=await fetch('/api/studio/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imgData,shape,nails:+nails.value,lines:+lines.value,contrast:+contrast.value,tone})});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Generation failed');
  previewData=d.preview;stats=d.stats;paint(previewData);
  document.getElementById('engine').textContent='PREVIEW READY · '+d.stats.generated_lines+' OPTIMIZED PATHS';
  document.getElementById('studioNotice').textContent='Adaptive density control active. '+d.stats.generated_lines+' useful paths selected from '+d.stats.requested_lines+' requested.';
 }catch(e){document.getElementById('engine').textContent='PREVIEW ERROR';document.getElementById('studioNotice').textContent=e.message}
 busy=false;
}
document.querySelectorAll('#shapes button').forEach(b=>b.onclick=()=>{shape=b.textContent;document.querySelectorAll('#shapes button').forEach(q=>q.classList.toggle('active',q===b));meta();generate()});
document.querySelectorAll('#tones button').forEach(b=>b.onclick=()=>{tone=b.dataset.v;document.querySelectorAll('#tones button').forEach(q=>q.classList.toggle('active',q===b));generate()});
[nails,lines,contrast].forEach(e=>e.onchange=()=>{meta();generate()});
document.getElementById('regen').onclick=generate;
document.getElementById('compare').onclick=()=>{const original=document.getElementById('compare').dataset.original==='1';if(original){paint(previewData);document.getElementById('compare').dataset.original='0';document.getElementById('compare').textContent='Original photo';document.getElementById('engine').textContent='PREVIEW READY'}else{paint(imgData);document.getElementById('compare').dataset.original='1';document.getElementById('compare').textContent='Back to string art';document.getElementById('engine').textContent='ORIGINAL REFERENCE'}};
document.getElementById('confirm').onclick=()=>{if(!previewData)return;cfg.shape=shape;cfg.anchor_nails=+nails.value;cfg.string_lines=stats?.generated_lines||+lines.value;cfg.thread_tone=tone;sessionStorage.setItem('dreamarts_studio_config',JSON.stringify(cfg));sessionStorage.setItem('dreamarts_selected_preview',previewData);location.href='/#custom'};
originalImg.onload=()=>{meta();document.querySelectorAll('#shapes button').forEach(b=>b.classList.toggle('active',b.textContent===shape));document.querySelector('#tones button').classList.add('active');generate()};originalImg.src=imgData;
</script></body></html>
