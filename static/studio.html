<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Studio</title><link rel="stylesheet" href="/styles.css"></head><body class="studio-page"><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>STUDIO</small></div><a class="btn light" href="/">Exit studio</a></div></nav><header class="studio-head"><div class="wrap"><div class="eyebrow">Dreamarts generation engine</div><h2 style="margin-bottom:6px">Shape your memory into thread.</h2><p class="lead" style="margin-left:0">Adjust the design, generate your preview, and choose the version you want us to create.</p></div></header><main class="wrap studio-grid"><section><div class="preview-stage"><div class="engine-badge" id="engine">GENERATING PREVIEW</div><canvas id="art" width="900" height="900"></canvas></div><div class="preview-meta"><span id="metaShape"></span><span id="metaSize"></span><span id="metaNails"></span><span id="metaLines"></span></div></section><aside class="studio-panel"><h3>Design controls</h3><div class="control"><label>Shape <span id="shapeVal"></span></label><div class="seg" id="shapes"><button>Circle</button><button>Square</button><button>Rectangle</button><button>Heart</button></div></div><div class="control"><label>Nail density <span id="nailVal"></span></label><input id="nails" type="range" min="200" max="1200" step="100"></div><div class="control"><label>Thread lines <span id="lineVal"></span></label><input id="lines" type="range" min="1000" max="8000" step="500"></div><div class="control"><label>Contrast <span id="contrastVal"></span></label><input id="contrast" type="range" min="30" max="150" value="90"></div><div class="control"><label>Thread tone</label><div class="seg" id="tones"><button data-v="black">Black</button><button data-v="sepia">Sepia</button><button data-v="blue">Blue</button><button data-v="red">Red</button></div></div><div class="studio-actions"><button class="btn" id="regen">Regenerate preview</button><button class="btn light" id="compare">Original photo</button><button class="btn" id="confirm">Continue with this design →</button></div><p id="studioNotice" class="notice"></p></aside></main><script>
const imgData=sessionStorage.getItem('dreamarts_studio_image'),cfg=JSON.parse(sessionStorage.getItem('dreamarts_studio_config')||'null');if(!imgData||!cfg){location.href='/#custom'};const c=document.getElementById('art'),x=c.getContext('2d'),im=new Image();let shape=cfg.shape==='Recommend'?'Circle':cfg.shape,tone='black',showOriginal=false;const nails=document.getElementById('nails'),lines=document.getElementById('lines'),contrast=document.getElementById('contrast');nails.value=cfg.anchor_nails||600;lines.value=cfg.string_lines||4000;
function pts(n,w,h){let a=[];for(let i=0;i<n;i++){let t=2*Math.PI*i/n;if(shape==='Square'){let q=i/n*4,s=q%1,side=Math.floor(q);let p=side===0?[s*w,0]:side===1?[w,s*h]:side===2?[(1-s)*w,h]:[0,(1-s)*h];a.push(p)}else a.push([w/2+Math.cos(t)*(w*.47),h/2+Math.sin(t)*(h*.47)])}return a}
function render(){document.getElementById('engine').textContent='DREAMARTS ENGINE · RENDERING';let W=900,H=900;x.clearRect(0,0,W,H);x.fillStyle='#efe9df';x.fillRect(0,0,W,H);if(showOriginal){x.save();x.beginPath();if(shape==='Circle')x.arc(450,450,423,0,7);else x.rect(30,30,840,840);x.clip();x.drawImage(im,30,30,840,840);x.restore();document.getElementById('engine').textContent='ORIGINAL REFERENCE';return}let p=pts(+nails.value,W,H),N=Math.min(+lines.value,2200), seed=17;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}x.save();if(shape==='Circle'){x.beginPath();x.arc(450,450,423,0,7);x.clip()}else{x.beginPath();x.rect(25,25,850,850);x.clip()}x.globalCompositeOperation='multiply';let colors={black:'20,18,16',sepia:'73,45,28',blue:'25,48,75',red:'92,31,28'};for(let i=0;i<N;i++){let A=Math.floor(rnd()*p.length),B=(A+Math.floor(8+rnd()*(p.length*.48)))%p.length;let mx=(p[A][0]+p[B][0])/2,my=(p[A][1]+p[B][1])/2;let pix=sample(mx,my);let alpha=Math.max(.025,Math.min(.18,(255-pix)/255*.18*contrast.value/90));x.strokeStyle='rgba('+colors[tone]+','+alpha+')';x.lineWidth=1;x.beginPath();x.moveTo(...p[A]);x.lineTo(...p[B]);x.stroke()}x.restore();x.strokeStyle='#171411';x.lineWidth=2;x.beginPath();if(shape==='Circle')x.arc(450,450,423,0,7);else x.rect(25,25,850,850);x.stroke();document.getElementById('engine').textContent='PREVIEW READY'}
let gray;function sample(px,py){let sx=Math.max(0,Math.min(599,Math.floor((px-30)/840*600))),sy=Math.max(0,Math.min(599,Math.floor((py-30)/840*600)));return gray?.data[(sy*600+sx)*4]??128}
function meta(){document.getElementById('shapeVal').textContent=shape;document.getElementById('nailVal').textContent=nails.value+' nails';document.getElementById('lineVal').textContent=Number(lines.value).toLocaleString()+' lines';document.getElementById('contrastVal').textContent=contrast.value+'%';document.getElementById('metaShape').textContent=shape;document.getElementById('metaSize').textContent=cfg.width_mm+' × '+cfg.height_mm+' mm';document.getElementById('metaNails').textContent=nails.value+' nails';document.getElementById('metaLines').textContent=Number(lines.value).toLocaleString()+' lines'}
document.querySelectorAll('#shapes button').forEach(b=>b.onclick=()=>{shape=b.textContent;meta();render()});document.querySelectorAll('#tones button').forEach(b=>b.onclick=()=>{tone=b.dataset.v;document.querySelectorAll('#tones button').forEach(q=>q.classList.remove('active'));b.classList.add('active');render()});[nails,lines,contrast].forEach(e=>e.oninput=()=>{meta();render()});document.getElementById('regen').onclick=render;document.getElementById('compare').onclick=()=>{showOriginal=!showOriginal;document.getElementById('compare').textContent=showOriginal?'Back to string art':'Original photo';render()};document.getElementById('confirm').onclick=()=>{cfg.shape=shape;cfg.anchor_nails=+nails.value;cfg.string_lines=+lines.value;cfg.thread_tone=tone;sessionStorage.setItem('dreamarts_studio_config',JSON.stringify(cfg));c.toBlob(b=>{let r=new FileReader();r.onload=()=>{sessionStorage.setItem('dreamarts_selected_preview',r.result);location.href='/#custom'};r.readAsDataURL(b,'image/png')})};
im.onload=()=>{let off=document.createElement('canvas');off.width=600;off.height=600;let ox=off.getContext('2d');ox.drawImage(im,0,0,600,600);gray=ox.getImageData(0,0,600,600);for(let i=0;i<gray.data.length;i+=4){let v=.299*gray.data[i]+.587*gray.data[i+1]+.114*gray.data[i+2];gray.data[i]=gray.data[i+1]=gray.data[i+2]=v}meta();render();document.querySelectorAll('#shapes button').forEach(b=>b.classList.toggle('active',b.textContent===shape));document.querySelector('#tones button').classList.add('active')};im.src=imgData;
</script></body></html>
