<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Studio</title><link rel="stylesheet" href="/styles.css"></head><body class="studio-page"><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>STUDIO</small></div><a class="btn light" href="/">Exit studio</a></div></nav><header class="studio-head"><div class="wrap"><div class="eyebrow">Dreamarts generation engine</div><h2 style="margin-bottom:6px">Shape your memory into thread.</h2><p class="lead" style="margin-left:0">Adjust the design, generate your preview, and choose the version you want us to create.</p></div></header><main class="wrap studio-grid"><section><div class="preview-stage"><div class="engine-badge" id="engine">GENERATING PREVIEW</div><canvas id="art" width="900" height="900"></canvas></div><div class="preview-meta"><span id="metaShape"></span><span id="metaSize"></span><span id="metaNails"></span><span id="metaLines"></span></div></section><aside class="studio-panel"><h3>Design controls</h3><div class="control"><label>Shape <span id="shapeVal"></span></label><div class="seg" id="shapes"><button>Circle</button><button>Square</button><button>Rectangle</button><button>Heart</button></div></div><div class="control"><label>Nail density <span id="nailVal"></span></label><input id="nails" type="range" min="200" max="1200" step="100"></div><div class="control"><label>Thread lines <span id="lineVal"></span></label><input id="lines" type="range" min="1000" max="8000" step="500"></div><div class="control"><label>Contrast <span id="contrastVal"></span></label><input id="contrast" type="range" min="30" max="150" value="90"></div><div class="control"><label>Thread tone</label><div class="seg" id="tones"><button data-v="black">Black</button><button data-v="sepia">Sepia</button><button data-v="blue">Blue</button><button data-v="red">Red</button></div></div><div class="studio-actions"><button class="btn" id="regen">Regenerate preview</button><button class="btn light" id="compare">Original photo</button><button class="btn" id="confirm">Continue with this design →</button></div><p id="studioNotice" class="notice"></p></aside></main><script>
const imgData=sessionStorage.getItem('dreamarts_studio_image'),cfg=JSON.parse(sessionStorage.getItem('dreamarts_studio_config')||'null');
if(!imgData||!cfg)location.href='/#custom';
const c=document.getElementById('art'),x=c.getContext('2d'),im=new Image(),SZ=180;
let shape=cfg.shape==='Recommend'?'Circle':cfg.shape,tone='black',showOriginal=false,target,residual,working=false;
const nails=document.getElementById('nails'),lines=document.getElementById('lines'),contrast=document.getElementById('contrast');
nails.value=cfg.anchor_nails||600;lines.value=cfg.string_lines||4000;
const colors={black:'20,18,16',sepia:'73,45,28',blue:'25,48,75',red:'92,31,28'};
function boundary(n){let p=[];for(let i=0;i<n;i++){let t=i/n*Math.PI*2;if(shape==='Circle')p.push([.5+.47*Math.cos(t),.5+.47*Math.sin(t)]);else if(shape==='Heart'){let q=t;let xx=16*Math.sin(q)**3,yy=13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q);p.push([.5+xx/38,.47-yy/38])}else{let q=i/n*4,s=q%1,k=Math.floor(q);p.push(k===0?[.03+.94*s,.03]:k===1?[.97,.03+.94*s]:k===2?[.97-.94*s,.97]:[.03,.97-.94*s])}}return p}
function inside(nx,ny){if(shape==='Circle'){let dx=nx-.5,dy=ny-.5;return dx*dx+dy*dy<.47*.47}if(shape==='Heart'){let X=(nx-.5)*2,Y=(.5-ny)*2;return (X*X+Y*Y-1)**3-X*X*Y**3<=0}return nx>.03&&nx<.97&&ny>.03&&ny<.97}
function prep(){let off=document.createElement('canvas');off.width=SZ;off.height=SZ;let o=off.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,SZ,SZ);let s=Math.max(im.width,im.height),sw=im.width/s,sh=im.height/s,dx=(1-sw)*SZ/2,dy=(1-sh)*SZ/2;o.drawImage(im,dx,dy,sw*SZ,sh*SZ);let d=o.getImageData(0,0,SZ,SZ);target=new Float32Array(SZ*SZ);for(let y=0;y<SZ;y++)for(let xx=0;xx<SZ;xx++){let i=(y*SZ+xx)*4,v=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2],nx=xx/SZ,ny=y/SZ;target[y*SZ+xx]=inside(nx,ny)?Math.max(0,(255-v)/255*contrast.value):0}}
function score(a,b,arr,steps=70){let sum=0,cnt=0;for(let k=2;k<steps-2;k++){let t=k/(steps-1),px=a[0]+(b[0]-a[0])*t,py=a[1]+(b[1]-a[1])*t;if(!inside(px,py))continue;let ix=Math.max(0,Math.min(SZ-1,Math.floor(px*SZ))),iy=Math.max(0,Math.min(SZ-1,Math.floor(py*SZ)));sum+=arr[iy*SZ+ix];cnt++}return cnt?sum/cnt:0}
function burn(a,b,arr,amount){for(let k=0;k<80;k++){let t=k/79,px=a[0]+(b[0]-a[0])*t,py=a[1]+(b[1]-a[1])*t;if(!inside(px,py))continue;let ix=Math.max(0,Math.min(SZ-1,Math.floor(px*SZ))),iy=Math.max(0,Math.min(SZ-1,Math.floor(py*SZ))),id=iy*SZ+ix;arr[id]=Math.max(0,arr[id]-amount);}}
function drawBase(){x.clearRect(0,0,900,900);x.fillStyle='#efe9df';x.fillRect(0,0,900,900)}
async function generate(){if(working)return;working=true;showOriginal=false;document.getElementById('engine').textContent='DREAMARTS ENGINE · ANALYSING IMAGE';prep();residual=new Float32Array(target);drawBase();let p=boundary(+nails.value),max=Math.min(+lines.value,2500),cur=0,chosen=[];x.save();x.globalCompositeOperation='multiply';x.strokeStyle='rgba('+colors[tone]+',0.055)';x.lineWidth=1;
for(let step=0;step<max;step++){let best=-1,bscore=-1;let tries=Math.min(90,p.length-1);for(let j=0;j<tries;j++){let gap=1+Math.floor((j+1)*p.length/(tries+1)),cand=(cur+gap)%p.length;if(cand===cur)continue;let s=score(p[cur],p[cand],residual);if(s>bscore){bscore=s;best=cand}}if(best<0||bscore<0.018){cur=(cur+Math.floor(p.length*.37))%p.length;continue}chosen.push([cur,best]);burn(p[cur],p[best],residual,.055);x.beginPath();x.moveTo(p[cur][0]*900,p[cur][1]*900);x.lineTo(p[best][0]*900,p[best][1]*900);x.stroke();cur=best;if(step%75===0){document.getElementById('engine').textContent='DREAMARTS ENGINE · '+Math.round(step/max*100)+'%';await new Promise(r=>setTimeout(r,0))}}
x.restore();x.strokeStyle='#171411';x.lineWidth=2;x.beginPath();if(shape==='Circle')x.arc(450,450,423,0,Math.PI*2);else{let bp=boundary(300);x.moveTo(bp[0][0]*900,bp[0][1]*900);bp.forEach(q=>x.lineTo(q[0]*900,q[1]*900));x.closePath()}x.stroke();document.getElementById('engine').textContent='PREVIEW READY';working=false}
function original(){drawBase();x.save();x.beginPath();if(shape==='Circle')x.arc(450,450,423,0,Math.PI*2);else{x.rect(25,25,850,850)}x.clip();x.drawImage(im,25,25,850,850);x.restore();document.getElementById('engine').textContent='ORIGINAL REFERENCE'}
function meta(){shape=shape[0].toUpperCase()+shape.slice(1).toLowerCase();document.getElementById('shapeVal').textContent=shape;document.getElementById('nailVal').textContent=nails.value+' nails';document.getElementById('lineVal').textContent=Number(lines.value).toLocaleString()+' lines';document.getElementById('contrastVal').textContent=contrast.value+'%';document.getElementById('metaShape').textContent=shape;document.getElementById('metaSize').textContent=cfg.width_mm+' × '+cfg.height_mm+' mm';document.getElementById('metaNails').textContent=nails.value+' nails';document.getElementById('metaLines').textContent=Number(lines.value).toLocaleString()+' lines'}
document.querySelectorAll('#shapes button').forEach(b=>b.onclick=()=>{shape=b.textContent;document.querySelectorAll('#shapes button').forEach(q=>q.classList.toggle('active',q===b));meta();generate()});
document.querySelectorAll('#tones button').forEach(b=>b.onclick=()=>{tone=b.dataset.v;document.querySelectorAll('#tones button').forEach(q=>q.classList.toggle('active',q===b));generate()});
[nails,lines,contrast].forEach(e=>e.onchange=()=>{meta();generate()});
document.getElementById('regen').onclick=generate;
document.getElementById('compare').onclick=()=>{showOriginal=!showOriginal;document.getElementById('compare').textContent=showOriginal?'Back to string art':'Original photo';showOriginal?original():generate()};
document.getElementById('confirm').onclick=()=>{cfg.shape=shape;cfg.anchor_nails=+nails.value;cfg.string_lines=+lines.value;cfg.thread_tone=tone;sessionStorage.setItem('dreamarts_studio_config',JSON.stringify(cfg));c.toBlob(b=>{let r=new FileReader();r.onload=()=>{sessionStorage.setItem('dreamarts_selected_preview',r.result);location.href='/#custom'};r.readAsDataURL(b,'image/png')})};
im.onload=()=>{meta();document.querySelectorAll('#shapes button').forEach(b=>b.classList.toggle('active',b.textContent===shape));document.querySelector('#tones button').classList.add('active');generate()};im.src=imgData;
</script></body></html>
