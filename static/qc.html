<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts QC</title><link rel="stylesheet" href="/styles.css"><style>.qc{max-width:760px;margin:auto}.card{border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}.check{display:flex;gap:12px;padding:14px;border-bottom:1px solid #eee;font-size:16px}.check input{width:20px;height:20px}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}</style></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>QUALITY CONTROL</small></div><a class="btn light" href="/production">Production</a></div></nav><main class="wrap section qc"><div class="eyebrow">Final inspection</div><h1 id="title">Loading…</h1><section class="card"><h2>QC Checklist</h2><label class="check"><input type="checkbox" id="nail_alignment"> Nail alignment and placement verified</label><label class="check"><input type="checkbox" id="string_tension"> String tension and finishing verified</label><label class="check"><input type="checkbox" id="design_match"> Final artwork matches approved design</label><label class="check"><input type="checkbox" id="frame_condition"> Frame and physical condition verified</label></section><section class="card"><h2>Evidence</h2><input id="photo" placeholder="Final artwork photo URL"><textarea id="notes" rows="5" placeholder="QC notes, defects or observations"></textarea></section><section class="card"><button class="btn" id="save">Save QC</button> <button class="btn light" id="approve">Approve QC</button><p id="msg"></p></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const id=new URLSearchParams(location.search).get('order'),cfg=await fetch('/api/public-config').then(r=>r.json()),sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),{data:{session}}=await sb.auth.getSession();if(!session||!id)location='/production';const H={Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};document.getElementById('title').textContent='Quality Control · '+id;const x=await fetch('/api/admin/orders/'+id+'/qc',{headers:H}).then(r=>r.json());const q=Array.isArray(x)?x[0]:null;if(q){['nail_alignment','string_tension','design_match','frame_condition'].forEach(k=>document.getElementById(k).checked=!!q[k]);photo.value=q.final_photo_url||'';notes.value=q.notes||''}const data=()=>({nail_alignment:nail_alignment.checked,string_tension:string_tension.checked,design_match:design_match.checked,frame_condition:frame_condition.checked,final_photo_url:photo.value,notes:notes.value,qc_status:'PENDING'});async function save(status){const d=data();d.qc_status=status;const r=await fetch('/api/admin/orders/'+id+'/qc',{method:'PUT',headers:H,body:JSON.stringify(d)});msg.textContent=r.ok?(status==='APPROVED'?'QC approved. Order moved forward.':'QC saved.'):'Could not save QC.'}save.onclick=()=>save('PENDING');approve.onclick=()=>{if(!nail_alignment.checked||!string_tension.checked||!design_match.checked||!frame_condition.checked){msg.textContent='Complete all checklist items before approval.';return}save('APPROVED')}</script></body></html>
