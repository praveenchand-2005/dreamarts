<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Manufacturing Specification</title><link rel="stylesheet" href="/styles.css"><style>.spec{max-width:1000px;margin:auto}.sheet{border:1px solid #ddd;border-radius:14px;padding:22px;margin:18px 0;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:12px;background:#f7f7f7;border-radius:9px}.item small{display:block;color:#777}.address{white-space:pre-line}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>MANUFACTURING SPECIFICATION</small></div><a href="/production" class="btn light">Production Board</a></div></nav><main class="wrap section spec"><div class="eyebrow">Production document</div><h1 id="title">Loading order…</h1><p id="status"></p><section class="sheet"><h2>Artwork Specification</h2><div class="grid" id="art"></div></section><section class="sheet"><h2>AI & Design Configuration</h2><div class="grid" id="design"></div></section><section class="sheet"><h2>Manufacturing Details</h2><div class="grid" id="manufacturing"></div></section><section class="sheet"><h2>Delivery Specification</h2><div id="address" class="address"></div></section><section class="sheet"><h2>Operations</h2><div id="ops"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const id=new URLSearchParams(location.search).get('order'),cfg=await fetch('/api/public-config').then(r=>r.json()),sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),{data:{session}}=await sb.auth.getSession();if(!session||!id)location='/production';const d=await fetch('/api/admin/orders/'+encodeURIComponent(id)+'/specification',{headers:{Authorization:'Bearer '+session.access_token}}).then(r=>r.json());const box=(k,v)=>'<div class="item"><small>'+k+'</small><b>'+((v??'Not specified'))+'</b></div>';document.getElementById('title').textContent='Order '+d.order_number;document.getElementById('status').textContent='Current status: '+String(d.status||'').replaceAll('_',' ');document.getElementById('art').innerHTML=box('Shape',d.artwork_shape)+box('Width',d.artwork_width_mm+' mm')+box('Height',d.artwork_height_mm+' mm');const n=d.production_notes||{};document.getElementById('design').innerHTML=box('AI Engine',n.selected_engine)+box('Selected Variant',n.selected_variant)+box('Artwork Focus',n.artwork_focus)+box('Thread Tone',n.thread_tone);document.getElementById('manufacturing').innerHTML=box('Anchor Nails',d.anchor_nails)+box('String Lines',d.string_lines)+box('Order Created',d.created_at)+box('Production Status',d.status);const s=d.shipping_address||{};document.getElementById('address').innerHTML='<b>'+[s.full_name,s.phone].filter(Boolean).join(' · ')+'</b><br>'+[s.address_line1,s.address_line2,s.city,s.state,s.postal_code,s.country].filter(Boolean).join('<br>');document.getElementById('ops').innerHTML=box('Courier',d.courier)+box('Tracking Number',d.tracking_number)+box('Admin Notes',d.admin_notes);</script></body></html>
