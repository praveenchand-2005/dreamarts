<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts</title><style>body{margin:0;background:#f5f0e8;font-family:Arial;color:#171512}nav{padding:18px 7%;background:white;font-weight:800;font-size:24px}.hero{text-align:center;padding:45px 15px}h1{font-size:clamp(36px,8vw,70px)}.grid{max-width:1100px;margin:auto;padding:15px;display:grid;grid-template-columns:380px 1fr;gap:20px}.card{background:#fffdfa;padding:22px;border-radius:18px}label{display:block;font-weight:bold;margin-top:12px}input{width:100%;padding:12px;box-sizing:border-box;margin-top:5px}button{width:100%;padding:14px;background:#171512;color:white;border:0;border-radius:10px;margin-top:18px;font-weight:bold}.preview{min-height:400px;display:flex;align-items:center;justify-content:center;background:#eee7dc}.preview img{width:100%}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#eee7dc}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><nav>DREAMARTS</nav><section class="hero"><h1>Your Photo.<br>Reimagined in Thread.</h1><p>Custom black-thread string art</p></section><main class="grid"><section class="card"><h2>Create your artwork</h2><form id="f"><label>Photo</label><input name="photo" type="file" accept="image/*" required><label>Board width (mm)</label><input name="widthMm" type="number" value="500"><label>Board height (mm)</label><input name="heightMm" type="number" value="500"><label>Anchor nails</label><input name="anchorNails" type="number" value="600"><label>String lines</label><input name="stringLines" type="number" value="4000"><p>Thread: Black only</p><button>Generate My String Art</button></form><div id="stats" class="stats"></div><div id="order" style="display:none"><h3>Ready to order?</h3><input id="name" placeholder="Your name"><input id="phone" placeholder="Phone / WhatsApp"><button id="ob">Send Custom Order</button><p id="or"></p></div></section><section class="card"><h2>Artwork result</h2><div class="preview" id="p">Upload a photo to begin</div><p id="s"></p></section></main><script>let plan;f.onsubmit=async e=>{e.preventDefault();s.textContent="Generating production plan...";let r=await fetch("/api/generate",{method:"POST",body:new FormData(f)}),d=await r.json();if(!r.ok){s.textContent=d.error;return}plan=d;p.innerHTML='<img src="'+d.preview+'?t='+Date.now()+'">';s.textContent="Complete";stats.innerHTML='<div class=stat>Nails<br><b>'+d.anchorNails+'</b></div><div class=stat>String lines<br><b>'+d.stringLines+'</b></div><div class=stat>Thread<br><b>'+d.estimatedThreadMeters+' m</b></div><div class=stat>Board<br><b>'+d.board.widthMm+'×'+d.board.heightMm+' mm</b></div>';order.style.display="block"};ob.onclick=async()=>{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({planId:plan.planId,customer:{name:name.value,phone:phone.value}})}),d=await r.json();or.textContent=d.orderNumber?"Order created: "+d.orderNumber:d.error}</script></body></html>
