<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts</title><style>body{margin:0;background:#f5f0e8;font-family:Arial;color:#171512}nav{padding:18px 7%;background:#fff;font-weight:800;font-size:24px}.hero{text-align:center;padding:40px 15px}h1{font-size:clamp(36px,8vw,70px)}.grid{max-width:1100px;margin:auto;padding:15px;display:grid;grid-template-columns:380px 1fr;gap:20px}.card{background:#fffdfa;padding:22px;border-radius:18px}label{display:block;font-weight:bold;margin-top:12px}input{width:100%;padding:12px;box-sizing:border-box;margin-top:5px;border:1px solid #aaa}button{width:100%;padding:14px;background:#171512;color:#fff;border:0;border-radius:10px;margin-top:18px;font-weight:bold}.preview{min-height:400px;display:flex;align-items:center;justify-content:center;background:#eee7dc}.preview img{width:100%;height:auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.stat{padding:10px;background:#eee7dc}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><nav>DREAMARTS</nav><section class="hero"><h1>Your Photo.<br>Reimagined in Thread.</h1><p>Custom black-thread string art</p></section><main class="grid"><section class="card"><h2>Create your artwork</h2><form id="generatorForm"><label>Photo</label><input name="photo" type="file" accept="image/*" required><label>Board width (mm)</label><input name="widthMm" type="number" value="500"><label>Board height (mm)</label><input name="heightMm" type="number" value="500"><label>Anchor nails</label><input name="anchorNails" type="number" value="600"><label>String lines</label><input name="stringLines" type="number" value="4000"><p>Thread: Black only</p><button id="generateBtn" type="submit">Generate My String Art</button></form><div id="statsBox" class="stats"></div></section><section class="card"><h2>Artwork result</h2><div class="preview" id="previewBox">Upload a photo to begin</div><p id="statusText"></p></section></main><script>let currentPlan=null;const form=document.getElementById('generatorForm'),btn=document.getElementById('generateBtn'),statusEl=document.getElementById('statusText'),preview=document.getElementById('previewBox'),stats=document.getElementById('statsBox');form.addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;statusEl.textContent='Generating production plan...';preview.textContent='Processing your photo...';try{const res=await fetch('/api/generate',{method:'POST',body:new FormData(form)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Generation failed');currentPlan=data;preview.innerHTML='';const img=document.createElement('img');img.src=data.preview+'?v='+Date.now();img.alt='Generated string art';preview.appendChild(img);statusEl.textContent='Generation complete!';stats.innerHTML='<div class="stat">Nails<br><b>'+data.anchorNails+'</b></div><div class="stat">String lines<br><b>'+data.stringLines+'</b></div><div class="stat">Thread<br><b>'+data.estimatedThreadMeters+' m</b></div><div class="stat">Board<br><b>'+data.board.widthMm+'×'+data.board.heightMm+' mm</b></div>'}catch(err){preview.textContent='Generation failed.';statusEl.textContent='Error: '+err.message}finally{btn.disabled=false}});</script></body></html>
