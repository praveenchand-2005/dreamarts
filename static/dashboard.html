<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dreamarts</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>MY ACCOUNT</small></div><button class="btn" id="logout">Logout</button></div></nav><main class="wrap section"><div class="eyebrow">Customer studio</div><h2 id="hello">My Dreamarts.</h2><div class="account-grid"><aside class="account-nav"><button class="active">Overview</button><button>My Orders</button><button>Profile</button></aside><section><div class="dashboard-stats"><div class="dash-stat"><b>0</b><span>Total artworks</span></div><div class="dash-stat"><b>0</b><span>In progress</span></div></div><div class="card"><h3>My artwork orders</h3><p id="orders">Your account is secure. Order history will appear here as we migrate orders to the permanent database.</p></div></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/public-config').then(r=>r.json());const supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='/login';else document.getElementById('hello').textContent='Hello, '+(session.user.user_metadata?.full_name||session.user.email.split('@')[0])+'.';document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='/'}</script></body></html>
