<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dreamarts</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>MY ACCOUNT</small></div><button class="btn" id="logout">Logout</button></div></nav><main class="wrap section"><div class="eyebrow">Customer studio</div><h2 id="hello">My Dreamarts.</h2><div class="account-grid"><aside class="account-nav"><button class="active">Overview</button><button>My Orders</button><button>Profile</button></aside><section><div class="dashboard-stats"><div class="dash-stat"><b>0</b><span>Total artworks</span></div><div class="dash-stat"><b>0</b><span>In progress</span></div></div><div class="card"><h3>My artwork orders</h3><p id="orders">Loading your real orders...</p></div></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/public-config').then(r=>r.json());const supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='/login';else document.getElementById('hello').textContent='Hello, '+(session.user.user_metadata?.full_name||session.user.email.split('@')[0])+'.';const r=await fetch('/api/my-orders',{headers:{Authorization:'Bearer '+session.access_token}});const orders=await r.json();if(Array.isArray(orders)){document.querySelector('.dash-stat b').textContent=orders.length;document.querySelectorAll('.dash-stat b')[1].textContent=orders.filter(o=>!['DELIVERED','CANCELLED'].includes(o.status)).length;document.getElementById('orders').innerHTML=orders.length?orders.map(o=>'<div class=order-row><div><b>'+o.order_number+'</b><p>'+o.artwork_shape+' · '+(o.artwork_width_mm&&o.artwork_height_mm?o.artwork_width_mm+' × '+o.artwork_height_mm+' mm':'Custom size')</p></div><span class=status-pill>'+o.status.replaceAll('_',' ')+'</span></div>').join(''):'<p>No artwork orders yet. <a href="/#custom">Create your first artwork.</a></p>'}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='/'}</script></body></html>
