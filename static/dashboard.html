<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dreamarts</title><link rel="stylesheet" href="/styles.css"></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>MY ACCOUNT</small></div><button class="btn" onclick="logout()">Logout</button></div></nav><main class="wrap section"><div class="eyebrow">Customer studio</div><h2 id="hello">My Dreamarts.</h2><div class="account-grid"><aside class="account-nav"><button class="active">Overview</button><button>My Orders</button><button>Profile</button></aside><section><div class="dashboard-stats"><div class="dash-stat"><b id="total">0</b><span>Total artworks</span></div><div class="dash-stat"><b id="progress">0</b><span>In progress</span></div></div><div class="card"><h3>My artwork orders</h3><div id="orders"><p>Loading your artwork journey...</p></div></div></section></div></main><script>const u=JSON.parse(localStorage.getItem('dreamarts_user')||'null');if(!u)location.href='/login';hello.textContent='Hello, '+(u?.name||'Creator')+'.';async function load(){let r=await fetch('/api/customer/orders?email='+encodeURIComponent(u.email));let d=await r.json();total.textContent=d.length;progress.textContent=d.filter(x=>!['DELIVERED','CANCELLED'].includes(x.status)).length;orders.innerHTML=d.length?d.map(o=>'<div class="order-row"><div><b>'+o.orderNumber+'</b><p>'+o.artwork.shape+' · '+o.artwork.size+'</p></div><div><span class="status-pill">'+o.status+'</span><a href="/track?order='+o.orderNumber+'">Track →</a></div></div>').join(''):'<p>No orders yet. <a href="/#custom">Create your first artwork.</a></p>'}function logout(){localStorage.removeItem('dreamarts_user');location.href='/'}load()</script></body></html>
