<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamarts Command Center</title><link rel="stylesheet" href="/styles.css"><style>.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.metric,.panel{border:1px solid #ddd;border-radius:14px;padding:18px;background:#fff}.metric b{display:block;font-size:28px;margin-top:8px}.panel{margin-top:18px}.bar{height:32px;background:#eee;border-radius:7px;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:#222;color:#fff;padding-left:8px;line-height:32px;min-width:25px}</style></head><body><nav class="nav"><div class="wrap nav" style="height:72px"><div class="brand">DREAMARTS <small>COMMAND CENTER</small></div><a href="/production" class="btn light">Operations</a></div></nav><main class="wrap section"><div class="eyebrow">Founder intelligence</div><h1>Business Command Center</h1><p>Live operational, commerce, quality and growth intelligence.</p><div class="metrics" id="metrics"></div><section class="panel"><h2>AI Founder Insights</h2><div id="insights">Loading insights…</div></section><section class="panel"><h2>Demand Forecast</h2><div id="forecast"></div></section><section class="panel"><h2>Order Pipeline</h2><div id="pipeline"></div></section><section class="panel"><h2>Quality Intelligence</h2><div id="quality"></div></section><section class="panel"><h2>Growth Intelligence</h2><div id="growth"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/public-config').then(r=>r.json()),sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),{data:{session}}=await sb.auth.getSession();if(!session)location='/login';const d=await fetch('/api/admin/analytics',{headers:{Authorization:'Bearer '+session.access_token}}).then(r=>r.json());const intel=await fetch('/api/admin/insights',{headers:{Authorization:'Bearer '+session.access_token}}).then(r=>r.json());insights.innerHTML=intel.founder_signals.map(x=>'<p>✦ '+x+'</p>').join('');forecast.innerHTML='<p>Expected orders, next 7 days: <b>'+intel.forecast.next_7_days_orders+'</b></p><p>Average paid order value: <b>₹'+Number(intel.finance.average_paid_order_value||0).toLocaleString('en-IN')+'</b></p><p>Open orders: <b>'+intel.operations.open_orders+'</b></p><p>Average open order age: <b>'+intel.operations.average_open_order_age_days+' days</b></p>';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const m=[['Revenue',money(d.revenue)],['Total orders',d.orders_total],['Paid orders',d.paid_orders],['Average rating',d.average_rating+' ★'],['QC pass rate',d.qc_pass_rate+'%'],['Successful referrals',d.successful_referrals]];metrics.innerHTML=m.map(x=>'<article class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></article>').join('');pipeline.innerHTML=Object.entries(d.order_status).map(([k,v])=>'<div><small>'+k.replaceAll('_',' ')+'</small><div class="bar"><span style="width:'+Math.max(8,v/Math.max(1,d.orders_total)*100)+'%">'+v+'</span></div></div>').join('');quality.innerHTML='<p>QC inspections: <b>'+d.qc_total+'</b></p><p>Approved inspections: <b>'+d.qc_approved+'</b></p><p>Pass rate: <b>'+d.qc_pass_rate+'%</b></p>';growth.innerHTML='<p>Customers with referral codes: <b>'+d.referral_customers+'</b></p><p>Successful referrals: <b>'+d.successful_referrals+'</b></p><p>Outstanding reward liability: <b>'+money(d.reward_liability)+'</b></p><p>Customer reviews: <b>'+d.reviews_total+'</b></p>';</script></body></html>
