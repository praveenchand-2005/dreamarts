name: Blender Render Pipeline

on:
  workflow_dispatch:
    inputs:
      start_frame:
        description: Start frame
        required: true
        default: "1"
      end_frame:
        description: End frame
        required: true
        default: "384"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: latest
      - name: Verify Blender
        run: blender --version
      - name: Render
        run: |
          mkdir -p renders
          blender -b assets/ashanagula_final.blend -s ${{ inputs.start_frame }} -e ${{ inputs.end_frame }} -o renders/ashanagula_ -F PNG -a
      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: ashanagula-render-${{ inputs.start_frame }}-${{ inputs.end_frame }}
          path: renders/
