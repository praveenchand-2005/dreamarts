name: Dreamarts Business Intelligence
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Business Intelligence
        env:
          DREAMARTS_URL: ${{ secrets.DREAMARTS_URL }}
          BI_TOKEN: ${{ secrets.BI_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST "${DREAMARTS_URL}/api/admin/business-intelligence/run" \
            -H "Authorization: Bearer ${BI_TOKEN}" \
            -H "Content-Type: application/json"
